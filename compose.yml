services:
  game:
    build:
      context: .
      args:
        DIEP_FRIED_VERSION: ${DIEP_FRIED_VERSION:-dev}
        DIEP_FRIED_REVISION: ${DIEP_FRIED_REVISION:-}
    ports:
      - '0.0.0.0:${GAME_PORT:-8080}:8080'
    environment:
      HOST: 0.0.0.0
      PORT: '8080'
      DIEP_FRIED_VERSION: ${DIEP_FRIED_VERSION:-dev}
      ALLOW_NO_ORIGIN: 'false'
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-32}
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
